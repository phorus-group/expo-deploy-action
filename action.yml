name: Expo Deploy Action
description: Triggers an EAS build/submit (or a JS-only OTA update) for an Expo app using the official Expo GitHub Action

inputs:
  expo-token:
    description: "Expo access token used to authenticate the EAS CLI (a robot token is recommended). Composite actions cannot read secrets, so pass it explicitly from the caller"
    required: true
  platform:
    description: "Platform to build: ios, android or all"
    required: false
    default: "all"
  profile:
    description: "EAS build profile from eas.json. With auto-submit enabled, the submit profile with the same name is used"
    required: false
    default: "production"
  auto-submit:
    description: "Auto-submit the build to the stores on success (eas build --auto-submit). Android goes to the track configured in the submit profile; iOS lands in TestFlight"
    required: false
    default: "true"
  ota:
    description: "Publish a JS-only over-the-air update (eas update) instead of running a full build. Requires expo-updates configured in the app. Fingerprint-based build-or-update is a Phase 3 enhancement"
    required: false
    default: "false"
  no-wait:
    description: "Exit as soon as the build is queued on EAS instead of blocking the runner until it finishes. Note: with no-wait, an EAS build failure will not fail the workflow"
    required: false
    default: "true"
  eas-version:
    description: "EAS CLI version to install"
    required: false
    default: "latest"
  working-directory:
    description: "Directory containing the Expo app"
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        case "${{ inputs.platform }}" in
          ios|android|all) ;;
          *)
            echo "::error::platform must be ios, android or all (got: ${{ inputs.platform }})"
            exit 1
            ;;
        esac

    - name: Setup EAS CLI
      uses: expo/expo-github-action@v8
      with:
        eas-version: ${{ inputs.eas-version }}
        token: ${{ inputs.expo-token }}

    # OTA mode: publish a JS-only over-the-air update (no store review).
    # NOTE: implemented as a shell step, not the continuous-deploy-fingerprint
    # sub-action, because a composite action resolves every `uses:` at job
    # setup regardless of `if:` — referencing a non-existent sub-action there
    # fails the whole job. Fingerprint-based build-or-update is Phase 3.
    - name: Publish OTA update
      if: ${{ inputs.ota == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: eas update --auto --non-interactive

    # Build mode: always trigger a full EAS build (and submission)
    - name: Build and submit
      if: ${{ inputs.ota != 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: >
        eas build
        --platform ${{ inputs.platform }}
        --profile ${{ inputs.profile }}
        --non-interactive
        ${{ inputs.no-wait == 'true' && '--no-wait' || '' }}
        ${{ inputs.auto-submit == 'true' && '--auto-submit' || '' }}

    - name: Deployment summary
      shell: bash
      run: |
        {
          echo "### Expo deploy triggered"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Mode | ${{ inputs.ota == 'true' && 'OTA update' || 'build + submit' }} |"
          echo "| Platform | ${{ inputs.platform }} |"
          echo "| Profile | ${{ inputs.profile }} |"
          echo "| Auto-submit | ${{ inputs.auto-submit }} |"
        } >> "$GITHUB_STEP_SUMMARY"
