name: Expo Deploy Action
description: Runs a single EAS build or submit for one platform, waiting for it to finish so the job status reflects the real result

inputs:
  expo-token:
    description: "Expo access token used to authenticate the EAS CLI (a robot token is recommended). Composite actions cannot read secrets, so pass it explicitly from the caller"
    required: true
  command:
    description: "What to run: build or submit"
    required: false
    default: "build"
  platform:
    description: "Single platform: android or ios"
    required: true
  profile:
    description: "EAS build/submit profile from eas.json"
    required: false
    default: "production"
  build-id:
    description: "EAS build id to submit (required when command=submit)"
    required: false
    default: ""
  eas-version:
    description: "EAS CLI version to install"
    required: false
    default: "latest"
  working-directory:
    description: "Directory containing the Expo app"
    required: false
    default: "."

outputs:
  build-id:
    description: "The EAS build id produced by a build command (empty for submit)"
    value: ${{ steps.build.outputs.build-id }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        case "${{ inputs.platform }}" in
          android|ios) ;;
          *) echo "::error::platform must be android or ios (got: ${{ inputs.platform }})"; exit 1 ;;
        esac
        case "${{ inputs.command }}" in
          build|submit) ;;
          *) echo "::error::command must be build or submit (got: ${{ inputs.command }})"; exit 1 ;;
        esac
        if [ "${{ inputs.command }}" = "submit" ] && [ -z "${{ inputs.build-id }}" ]; then
          echo "::error::command=submit requires build-id"; exit 1
        fi

    - name: Setup EAS CLI
      uses: expo/expo-github-action@v8
      with:
        eas-version: ${{ inputs.eas-version }}
        token: ${{ inputs.expo-token }}

    # Build one platform and WAIT for it to finish (no --no-wait), so the job
    # goes red if the build fails. --json gives us the build id + final status.
    - name: EAS build (${{ inputs.platform }})
      id: build
      if: ${{ inputs.command == 'build' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -uo pipefail
        echo "Building ${{ inputs.platform }} with profile ${{ inputs.profile }} (waiting for completion)..."
        OUT=$(eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --json) || true
        printf '%s' "$OUT" > build.json
        ID=$(node -e "try{const b=require('./build.json');const x=Array.isArray(b)?b[0]:b;process.stdout.write(String((x&&x.id)||''))}catch(e){}")
        STATUS=$(node -e "try{const b=require('./build.json');const x=Array.isArray(b)?b[0]:b;process.stdout.write(String((x&&x.status)||''))}catch(e){}")
        echo "build-id=$ID" >> "$GITHUB_OUTPUT"
        {
          echo "### ${{ inputs.platform }} build"
          echo "- id: \`$ID\`"
          echo "- status: \`${STATUS:-unknown}\`"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "Build id: $ID | status: ${STATUS:-unknown}"
        if [ "$STATUS" != "FINISHED" ]; then
          echo "::error::${{ inputs.platform }} build did not finish (status: ${STATUS:-unknown})"
          exit 1
        fi

    # Submit a previously-built binary and WAIT, so the job reflects the real
    # submission result (store upload accepted / rejected).
    - name: EAS submit (${{ inputs.platform }})
      if: ${{ inputs.command == 'submit' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        echo "Submitting ${{ inputs.platform }} build ${{ inputs.build-id }} with profile ${{ inputs.profile }}..."
        eas submit --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --id "${{ inputs.build-id }}" --non-interactive
        {
          echo "### ${{ inputs.platform }} submission"
          echo "- build id: \`${{ inputs.build-id }}\`"
          echo "- submitted ✔"
        } >> "$GITHUB_STEP_SUMMARY"
